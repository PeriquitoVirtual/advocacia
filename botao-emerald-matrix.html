<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravyx - Botão Emerald Matrix</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&display=swap" rel="stylesheet">

    <style>/* upw:upw73cec7af4987 */
        body {
            background-color: #050505;
            font-family: 'Darker Grotesque', sans-serif;
        }

        @keyframes borderTurn {
            0% { transform: rotate(0); }
            to { transform: rotate(360deg); }
        }

        @keyframes borderTurnWithTranslate {
            0% { transform: translate(-50%, -50%) rotate(0); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
            50% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.6), 0 0 80px rgba(16, 185, 129, 0.2); }
        }

        .btn-wrapper {
            isolation: isolate;
            overflow: hidden;
            border-radius: 50px;
            position: relative;
            width: fit-content;
            margin: auto;
            --animation-speed: 3s;
            box-shadow: 0 10px 40px -10px rgba(16, 185, 129, 0.4);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            animation: breathe 4s ease-in-out infinite;
        }

        .btn-wrapper:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 20px 60px -5px rgba(16, 185, 129, 0.5),
                        0 0 100px rgba(52, 211, 153, 0.2);
            animation: none;
        }

        .btn-wrapper .mask-layer-1,
        .btn-wrapper .mask-layer-2 { opacity: 1; }

        .mask-layer-1,
        .animated-border {
            left: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            z-index: 1;
        }

        .mask-layer-1:before,
        .animated-border:before {
            content: "";
            float: left;
            padding-top: 100%;
        }

        .mask-layer-1:after,
        .animated-border:after {
            clear: both;
            content: "";
            display: block;
        }

        .mask-layer-1 {
            opacity: 0;
            pointer-events: none;
            transition: 1s ease opacity;
        }

        .mask-layer-1 * {
            height: 100%;
            left: 0;
            position: absolute;
            top: 0;
            width: 100%;
        }

        .animated-border,
        .blur-layer,
        .svg-container {
            animation: borderTurn var(--animation-speed) infinite linear;
            background-image: conic-gradient(from 0 at 50% 50%,
                #10b981 0deg, rgba(16, 185, 129, 0) 80deg,
                rgba(52, 211, 153, 0) 280deg, #34d399 360deg);
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
        }

            mask: url("data:image/svg+xml,%3Csvg width='28' height='24' viewBox='0 0 28 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M14.0534 15.732C13.8444 15.283 14.2848 14.8489 14.7326 15.051C14.8296 15.0959 14.9043 15.1707 14.949 15.268C15.1506 15.717 14.7177 16.1511 14.2698 15.949C14.1728 15.9041 14.0982 15.8293 14.0534 15.732Z' fill='black'/%3E%3Cpath d='M18.8001 13.5093C19.0016 13.0603 18.5687 12.6263 18.1209 12.8283C18.0239 12.8732 17.9492 12.9481 17.9045 13.0453C17.6955 13.4944 18.1358 13.9284 18.5837 13.7264C18.6807 13.6815 18.7553 13.6066 18.8001 13.5093Z' fill='black'/%3E%3Cpath d='M0.949043 2.732C1.15057 2.28297 0.717663 1.84891 0.269836 2.05097C0.172806 2.09587 0.098162 2.17071 0.0533793 2.268C-0.155607 2.71703 0.284759 3.15109 0.732587 2.94903C0.829616 2.90413 0.90426 2.82929 0.949043 2.732Z' fill='black'/%3E%3Cpath d='M26.9489 7.732C27.151 7.28297 26.7169 6.84891 26.2679 7.05097C26.1706 7.09587 26.0958 7.17071 26.0508 7.268C25.8488 7.71703 26.2828 8.15109 26.7319 7.94903C26.8292 7.90413 26.904 7.82929 26.9489 7.732Z' fill='black'/%3E%3Cpath d='M13.0534 5.732C12.8444 5.28297 13.2848 4.84891 13.7326 5.05097C13.8296 5.09587 13.9043 5.17071 13.949 5.268C14.1506 5.71703 13.7177 6.15109 13.2698 5.94903C13.1728 5.90413 13.0982 5.82929 13.0534 5.732Z' fill='black'/%3E%3Cpath d='M10.0534 17.732C9.84439 17.283 10.2848 16.8489 10.7326 17.051C10.8296 17.0959 10.9043 17.1707 10.949 17.268C11.1506 17.717 10.7177 18.1511 10.2698 17.949C10.1728 17.9041 10.0982 17.8293 10.0534 17.732Z' fill='black'/%3E%3Cpath d='M15.0534 21.732C14.8444 21.283 15.2848 20.8489 15.7326 21.051C15.8296 21.0959 15.9043 21.1707 15.949 21.268C16.1506 21.717 15.7177 22.1511 15.2698 21.949C15.1728 21.9041 15.0982 21.8293 15.0534 21.732Z' fill='black'/%3E%3C/svg%3E");
            mask-repeat: repeat;
            -webkit-mask-repeat: repeat;
        }

        .blur-layer {
            filter: blur(10px);
            opacity: .25;
        }

        .animated-border {
            animation-name: borderTurnWithTranslate;
        }

        .mask-layer-2 {
            border-radius: 50px;
            content: "";
            height: 100%;
            inset: 0;
            left: 0;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: xor;
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            padding: 1.5px;
            pointer-events: none;
            position: absolute;
            top: 0;
            transition: 1s ease opacity;
            width: 100%;
            z-index: 1;
        }

        .btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 2px;
            background: linear-gradient(180deg, rgba(16, 185, 129, .08) 0%, #030d08 50%, #000000 100%);
            border: 1px solid rgba(16, 185, 129, .2);
            border-radius: 50px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
            flex-wrap: nowrap;
        }

        .btn-text {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 18px 40px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 14px;
            font-weight: 800;
            color: #d1fae5;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .btn-text::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #10b981, transparent);
            transition: width 0.4s ease;
        }

        .btn-wrapper:hover .btn-text::after {
            width: 90%;
            height: 2px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .btn-wrapper:hover .btn-text {
            color: #fff;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
        }

        @media(max-width:480px) {
            .btn-inner { gap: 10px; padding: 6px; }
            .btn-text { font-size: 13px; padding: 14px 24px; }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <div class="btn-wrapper" style="margin: 0;">
        <div class="mask-layer-1">
            <div class="blur-layer"></div>
            <div class="svg-mask"><div class="svg-container"></div></div>
        </div>
        <div class="mask-layer-2">
            <div class="animated-border"></div>
        </div>
        <a href="#" style="text-decoration: none;">
            <div class="btn-inner">
                <div class="btn-text">Explorar Agora</div>
            </div>
        </a>
    </div>

</body>

</html>
